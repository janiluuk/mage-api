name: PHP Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mage-api/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mage-api/**'
      - '.github/workflows/tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: mage
          MYSQL_USER: mage
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, bcmath, gd, exif, pcntl
          coverage: none

      - name: Copy .env file
        working-directory: ./mage-api
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi
          echo "APP_KEY=" >> .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=mage" >> .env
          echo "DB_USERNAME=mage" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "JWT_SECRET=testing-secret-key-for-github-actions" >> .env
          echo "QUEUE_CONNECTION=sync" >> .env
          echo "CACHE_DRIVER=array" >> .env
          echo "SESSION_DRIVER=array" >> .env

      - name: Install Composer dependencies
        working-directory: ./mage-api
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        working-directory: ./mage-api
        run: php artisan key:generate

      - name: Generate JWT secret
        working-directory: ./mage-api
        run: php artisan jwt:secret --force || echo "JWT_SECRET already set"

      - name: Run database migrations
        working-directory: ./mage-api
        run: php artisan migrate --force --env=testing
        continue-on-error: true

      - name: Run PHPUnit tests
        working-directory: ./mage-api
        run: vendor/bin/phpunit --testdox

